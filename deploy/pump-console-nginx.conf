limit_conn_zone $binary_remote_addr zone=pump_console_peers:10m;
log_format pump_console_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 192.0.2.10:443 ssl default_server;
    server_name 192.0.2.10;
    server_tokens off;

    ssl_certificate /etc/pump-console/tls/server.crt;
    ssl_certificate_key /etc/pump-console/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PumpConsoleTLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    if ($host != "192.0.2.10") { return 444; }
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_conn pump_console_peers 64;
    access_log /var/log/nginx/pump-console-access.log pump_console_safe;
    error_log /var/log/nginx/pump-console-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 192.0.2.10;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
    }
}
